<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Icons. -->
  <title>pisite</title>
  <link rel="icon" href="{{ url_for('static', filename='images/icons/favicon.ico') }}" type="image/x-icon">
  <link rel="icon" href="{{ url_for('static', filename='images/icons/favicon-16x16.png') }}" sizes= "16x16" type="image/png">
  <link rel="icon" href="{{ url_for('static', filename='images/icons/favicon-32x32.png') }}" sizes= "32x32" type="image/png">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/icons/apple-touch-icon.png') }}">
  <link rel="icon" href="{{ url_for('static', filename='images/icons/android-chrome-192x192.png') }}" sizes="192x192" type="image/png">
  <link rel="icon" href="{{ url_for('static', filename='images/icons/android-chrome-512x512.png') }}" sizes="512x512" type="image/png">
  <link rel="manifest" href="{{ url_for('static', filename='site.webmanifest') }}">
  <!-- Stylesheets. -->
     <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='switch.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='switcharray.css') }}">

  <!-- <link rel="stylesheet" href="{{ url_for('static', filename='table.css') }}"> -->

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

</head>
<body>
  {% if debug_mode %}
  <div class="debug-banner">
    Debug mode is ON!!!!!
  </div>
  {% endif %}
  <h1>Hardware Control</h1>
  <div class="switch-array">
    <label class="switch-row">
      <span class="switch-label">LEDs</span>
      <label class="switch">
        <input type="checkbox" id="leds-switch" {{ 'checked' if leds_on else '' }}>
        <span class="slider round"></span>
      </label>
    </label>
    <label class="switch-row">
      <span class="switch-label">Fan</span>
      <label class="switch">
        <input type="checkbox" id="fan-switch" {{ 'checked' if fan_on else '' }}>
        <span class="slider round"></span>
      </label>
    </label>
  </div>
  <br>
  <a href="{{ url_for('static', filename='images/circuit.png') }}" target="_blank">
    control circuit diagram
  </a>
  <h1>Services</h1>
  <table class="table table-striped">
    <thead>
      <tr>
        <th>Service</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="service-monitor-table-body">
    </tbody>
  </table>
  <h1>Metrics</h1>
  <div>
    CPU Temperature: <span id="cpu-temperature"></span>
  </div>
  <meta name="token" content="{{ token }}">
  <script src="{{ url_for('static', filename='pisite.js') }}"></script>
</body>
</html>
